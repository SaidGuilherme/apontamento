name: apontamento-horas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apontamento}
      POSTGRES_USER: ${POSTGRES_USER:-apontamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apontamento}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-apontamento};Username=${POSTGRES_USER:-apontamento};Password=${POSTGRES_PASSWORD:-apontamento}"
      DataProtection__KeysPath: /keys
      TZ: America/Sao_Paulo
    volumes:
      - keys:/keys
    ports:
      - "${API_PORT:-5080}:8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
  keys:
